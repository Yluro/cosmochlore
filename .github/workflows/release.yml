name: Build and Release Cosmochlore

on:
  release:
    types: [published]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-14
            target: aarch64-apple-darwin
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.target }}
          cp target/${{ matrix.target }}/release/cosmochlore${{ matrix.ext }} \
             dist/${{ matrix.target }}/cosmochlore${{ matrix.ext }}
          cd dist/${{ matrix.target }}
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../cosmochlore-${{ matrix.target }}.zip cosmochlore${{ matrix.ext }}
          else
            tar czf ../cosmochlore-${{ matrix.target }}.tar.gz cosmochlore${{ matrix.ext }}
          fi
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cosmochlore-${{ matrix.target }}.*