name: Build and Release Cosmochlore

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      previous_tag: ${{ steps.changelog.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build changelog from previous tag
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # Most recent tag that is an ancestor of this one, if any.
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"

          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..${TAG}"
            HEADER="Changes since [\`${PREV_TAG}\`](${REPO_URL}/releases/tag/${PREV_TAG})"
            FOOTER="**Full changelog**: ${REPO_URL}/compare/${PREV_TAG}...${TAG}"
          else
            RANGE="${TAG}"
            HEADER="Initial release"
            FOOTER="**Full changelog**: ${REPO_URL}/commits/${TAG}"
          fi

          {
            echo "## ${HEADER}"
            echo
            git log --no-merges --reverse \
                    --format="- %s ([\`%h\`](${REPO_URL}/commit/%H))" \
                    "${RANGE}"
            echo
            echo "${FOOTER}"
          } > CHANGELOG.md

          echo "previous_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          cat CHANGELOG.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          prerelease: ${{ contains(github.ref_name, '-') }}

  build:
    name: Build ${{ matrix.target }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-14
            target: aarch64-apple-darwin
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.target }}
          cp target/${{ matrix.target }}/release/cosmochlore${{ matrix.ext }} \
             dist/${{ matrix.target }}/cosmochlore${{ matrix.ext }}
          cd dist/${{ matrix.target }}
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../cosmochlore-${{ matrix.target }}.zip cosmochlore${{ matrix.ext }}
          else
            tar czf ../cosmochlore-${{ matrix.target }}.tar.gz cosmochlore${{ matrix.ext }}
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/cosmochlore-${{ matrix.target }}.*
