[package]
name = "cosmochlore"
version = "1.1.0"
edition = "2024"
authors = ["José Serrano Guarinos <jose.serranog@ub.edu>"]
description = "Continuous Shape Measurements in Rust."
repository = "https://github.com/Yluro/cosmochlore"
homepage = "https://github.com/Yluro/cosmochlore"
license = "GPL-3"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
nalgebra = "0.35.0"
itertools = "0.15.0"
argmin = { version = "0.11" }
argmin-math = { version = "0.5", default-features = false, features = ["vec"] }